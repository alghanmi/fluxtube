version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-dependencies:
        dependency-type: 'development'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
    # TypeScript major bumps need a coordinated upgrade across every
    # workspace (root, workers/sync, workers/dashboard, dashboard,
    # site, scripts) plus a review of tsconfig + libcheck output.
    # Dedicated PRs for those; weekly Dependabot bumps stay on the
    # current major.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @cloudflare/vitest-pool-workers (0.22.x) declares a peer of
      # vitest ^4.1.0; under vitest 5 every workerd test isolate dies with
      # `SyntaxError: Unexpected identifier 'file'`. Revisit when
      # `npm view @cloudflare/vitest-pool-workers peerDependencies` accepts ^5.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']

  # Note: no per-workspace `npm` entries. This is a pnpm workspace — the
  # lockfile lives at the repo root, and Dependabot's per-directory npm
  # runs update the workspace package.json but cannot regenerate the
  # root pnpm-lock.yaml. Every resulting PR fails CI with
  # ERR_PNPM_OUTDATED_LOCKFILE. The single `/` entry above covers every
  # workspace (root + workers/* + dashboard + site + scripts).

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'

  - package-ecosystem: 'terraform'
    directory: '/infrastructure/terraform/environments/production'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(terraform)'
    # cloudflare/cloudflare >= 5.25.0 can't refresh wrangler-deployed Worker
    # scripts (see environments/production/main.tf, #197). Revisit when a
    # release fixes it. Any bump needs `make plan` against production before
    # merge, since CI only validates — #192 (5.25.0) went green and broke plan.
    ignore:
      - dependency-name: 'cloudflare/cloudflare'
        versions: ['>= 5.25.0']

  - package-ecosystem: 'terraform'
    directory: '/infrastructure/terraform/_modules/fluxtube-environment'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(terraform)'
