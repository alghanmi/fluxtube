name: Notify deploy (manual)

# Manual escape hatch for firing a deploy-release dispatch.
#
# Why this isn't on `release: [published]`: when release-please cuts a
# release using GITHUB_TOKEN, GitHub's anti-recursion safeguard suppresses
# the downstream `release` event. So `on: release` would never fire. The
# auto-dispatch is now wired directly inside release-please.yml.
#
# This workflow stays around as a manual entrypoint for cases like:
#   - re-running a stuck deploy
#   - deploying an older tag
#   - testing the dispatch chain without cutting a new release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.2.1; a bare 1.2.1 also works)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch deploy-release event
    runs-on: ubuntu-latest
    # `environment: production` is required so the dispatch step can resolve
    # DEPLOY_DISPATCH_TOKEN — same reason release-please.yml carries it.
    environment: production
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DEPLOY_TARGET_REPO: ${{ secrets.DEPLOY_TARGET_REPO }}
          READ_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          : "${DEPLOY_TARGET_REPO:?DEPLOY_TARGET_REPO is not set in the production environment}"
          # Accept a bare semver (1.2.1) as well as the tag (v1.2.1).
          case "${TAG}" in [0-9]*) TAG="v${TAG}" ;; esac
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${TAG}' is not a release tag (vX.Y.Z)."
            exit 1
          fi
          version="${TAG#v}"
          # The tag's own commit, the same value release-please.yml sends.
          # github.sha is the HEAD of the branch this run was started from,
          # which is ahead of the tag as soon as main moves on, and a deploy
          # that checks the commit against the payload then refuses it.
          # GITHUB_TOKEN reads this repo; the dispatch token is only for the POST.
          SHA="$(GH_TOKEN="${READ_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          gh api "repos/${DEPLOY_TARGET_REPO}/dispatches" \
            -f event_type=deploy-release \
            -f "client_payload[version]=${version}" \
            -f "client_payload[sha]=${SHA}" \
            -f "client_payload[actor]=${ACTOR}" \
            -f "client_payload[ref]=${TAG}"
          {
            echo "### Dispatched deploy-release"
            echo "- version: \`${version}\`"
            echo "- ref: \`${TAG}\`"
            echo "- sha: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
