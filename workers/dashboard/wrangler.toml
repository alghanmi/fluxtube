# Placeholder — see workers/sync/wrangler.toml. The real name comes from the
# Terraform output `dashboard_worker_name`; every deploy MUST pass `--name`.
name = "fluxtube-dashboard-placeholder"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# No workers.dev URL. The PWA reaches this Worker only through the Pages
# Function at dashboard/functions/api/[[path]].ts over the DASHBOARD Service
# Binding, so a public workers.dev hostname adds attack surface and nothing
# else. `wrangler dev` is unaffected.
workers_dev = false

# ── Build-time string substitution ────────────────────────────────────────────
# wrangler replaces the bare identifier `VERSION` in the bundle at build time.
# The deploy workflow overrides this with the version from the project root
# `package.json`. The value here is the default for `wrangler dev` and the
# cloudflare/vitest-pool-workers test bundle.
[define]
VERSION = "\"0.0.0-dev\""

# ── Cron trigger (nightly R2 backup) ──────────────────────────────────────────
# Deliberately absent — Terraform owns the schedule
# (`cloudflare_workers_cron_trigger.dashboard`, gated by
# `var.dashboard_cron_enabled`). See workers/sync/wrangler.toml for why.

# ── R2 binding (nightly backups, Phase 5) ─────────────────────────────────────
# Terraform creates the real bucket (120-day lifecycle rule). As with D1,
# `wrangler deploy` re-uploads this binding, so the deploy pipeline rewrites
# `bucket_name` from the Terraform output `backup_bucket_name` before deploy.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "fluxtube-backups-placeholder"

# ── D1 binding (shared with sync worker) ──────────────────────────────────────
# Same D1 database as workers/sync. Placeholders, rewritten by the deploy
# pipeline from Terraform outputs — see workers/sync/wrangler.toml.
#
# `migrations_dir` points at the sync worker's migrations folder so both
# workers share the same migration ledger.
[[d1_databases]]
binding = "DB"
database_name = "fluxtube"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../sync/migrations"

# ── Logs ──────────────────────────────────────────────────────────────────────
[observability]
enabled = true
