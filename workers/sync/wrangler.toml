# Placeholder. Production Worker names are instance-prefixed
# (`fluxtube-<instance_id>-sync`) and come from the Terraform output
# `sync_worker_name`; every deploy MUST pass `--name`. Script upload is an
# upsert, so deploying without `--name` doesn't fail — it silently creates a
# separate Worker under this placeholder name with none of the secrets.
name = "fluxtube-sync-placeholder"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Expose the operator endpoints (`POST /sync`, `GET /audit` — see router.ts)
# on the workers.dev subdomain; operator scripts call them directly. Every
# request is Bearer-checked (`MANUAL_TRIGGER_TOKEN`) before anything else
# runs. Move to a custom domain later — see #108.
workers_dev = true

# ── Build-time string substitution ────────────────────────────────────────────
# wrangler replaces the bare identifier `VERSION` in the bundle at build time.
# The deploy pipeline overrides this on production deploys with the version from
# the root `package.json`. The value here is the default for `wrangler dev`
# and is also what the cloudflare/vitest-pool-workers test bundle sees.
# See `src/globals.d.ts` for the matching TypeScript declaration.
[define]
VERSION = "\"0.0.0-dev\""

# ── Cron trigger ──────────────────────────────────────────────────────────────
# Deliberately absent. Terraform is the only owner of the schedule
# (`cloudflare_workers_cron_trigger.sync`, gated by `var.cron_enabled`).
# With no `[triggers]` table, `wrangler deploy` leaves the deployed schedule
# untouched; declaring one here would re-arm the cron on every deploy and
# defeat the `cron_enabled = false` kill switch. Locally, use
# `wrangler dev --test-scheduled` and hit `/cdn-cgi/local/scheduled`.

# ── Non-secret vars ───────────────────────────────────────────────────────────
# Vars are owned by Terraform (set as plain_text bindings on the script
# resource from GitHub environment variables). The deploy workflow runs
# `wrangler deploy --keep-vars` so wrangler never clobbers them.
#
# For local `wrangler dev`, put placeholder values in `.dev.vars` alongside
# the secrets — wrangler dev loads vars and secrets identically from that
# file.

# ── D1 binding ────────────────────────────────────────────────────────────────
# Terraform declares the real binding on `cloudflare_workers_script.sync`
# (infrastructure/terraform/_modules/fluxtube-environment/worker_sync.tf).
# `wrangler deploy` re-uploads bindings from THIS file, though, so the deploy
# pipeline rewrites `database_name` + `database_id` from Terraform outputs
# immediately before deploying. The values below are placeholders.
#
# For local `wrangler dev --remote`: copy this file to a personal
# `wrangler.local.toml` (gitignored), drop in your dev D1 UUID, and run
# `wrangler dev --remote --config wrangler.local.toml`. Don't commit the real
# UUID — it identifies a specific tenant's resource.
[[d1_databases]]
binding = "DB"
database_name = "fluxtube"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ── Logs ──────────────────────────────────────────────────────────────────────
[observability]
enabled = true
